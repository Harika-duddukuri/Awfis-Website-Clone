<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Login - Awfis</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <a href="CaseStudy.html" class="close-btn">×</a>
            <h1>Login</h1>
            <form id="loginForm">

                <input type="email"
                       id="email"
                       placeholder="E-mail">
                <p id="emailError"></p>

                <input type="password"
                       id="password"
                       placeholder="Password">
                <p id="passwordError"></p>

                <button type="submit" class="login-btn">
                    LOGIN
                </button>
            </form>
            <a href="register.html" class="signup-btn">
                SIGN UP WITH EMAIL
            </a>
            <a href="#" class="forgot-password"
               onclick="forgotPassword(event)">
                FORGOT YOUR PASSWORD?
            </a>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
